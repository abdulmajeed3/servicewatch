version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: servicewatch
      POSTGRES_PASSWORD: servicewatch_dev
      POSTGRES_DB: servicewatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicewatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
